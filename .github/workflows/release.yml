name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf editor-${{ runner.os }}.tar.gz -C build your-editor
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/Release/your-editor.exe -DestinationPath editor-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            editor-*.tar.gz
            editor-*.zip