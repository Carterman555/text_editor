name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libfreetype-dev \
            libopenal-dev libvorbis-dev libflac-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf text-editor-${{ runner.os }}.tar.gz -C build/bin text-editor

      - name: Rename (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item build/bin/Release/text-editor.exe -Destination text-editor-Windows.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            text-editor-*.tar.gz
            text-editor-Windows.exe
          draft: true
          fail_on_unmatched_files: true