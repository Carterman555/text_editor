name: Release
on:
  push:
    branches: [main]
    # tags: ['v*']

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxcursor-dev libxi-dev \
            libudev-dev libgl1-mesa-dev libfreetype-dev \
            libopenal-dev libvorbis-dev libflac-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Show build output
        run: ls -R build
        shell: bash

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf editor-${{ runner.os }}.tar.gz -C build/bin main

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/bin/Release/main.exe -DestinationPath editor-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: editor-${{ runner.os }}
          path: |
            editor-*.tar.gz
            editor-*.zip
          if-no-files-found: error